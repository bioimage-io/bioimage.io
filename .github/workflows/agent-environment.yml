name: No agent environment in the repo

# This repository is public, and CLAUDE.md forbids publishing anything about the
# environment an automated contributor works in: session ids, workspace ids, the
# names and commands of that tooling, machine names, and absolute paths on
# somebody's machine. The rule was already written and was still broken, so this
# runs the check on every change rather than relying on a reader noticing.
#
# WHAT ACTUALLY RUNS HERE, counted rather than asserted: the numbers below were read
# out of the check in both states, not written from memory, because the previous
# version of this comment said "eight rules: five always run" and had been wrong
# since two of them were added. A file whose own standard is not to overclaim
# coverage should not overclaim its own.
#
# On a runner there is no developer home, the agent tooling is unreachable, and the
# git-ignored vocabulary file is absent, so:
#
#   pattern rules            4 of 7 run   (id-in-position, workspace id,
#                                          bare row number, developer path by shape)
#   dropped for no vocabulary    3        (backlog directory, tooling command,
#                                          row reference after a tool name)
#   literal-value rules          0 of 4   (session ids, session names, machine names,
#                                          this machine's paths by name)
#
# So the exit code here is driven by the four shape rules, which are the ones that
# catch a published identifier without being told what to look for. Every rule that
# did not run prints NOT CHECKED with a reason, and the self-test prints and counts
# its skipped groups, so a green tick here never means "all of it was examined".

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Run the self-test first. A checker that has stopped being able to go red
      # reports a clean tree and a dirty tree identically, so prove it
      # discriminates before trusting the result of the run below.
      - name: The check can still fail
        run: node scripts/check-no-agent-environment.js --self-test

      - name: No tracked file names the agent environment
        run: node scripts/check-no-agent-environment.js
